name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Throwaway database for the tests/db round-trip suite, created fresh on
    # each run. The credentials are CI-only and protect nothing.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: password
          POSTGRES_DB: driftwatch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:password@localhost:5432/driftwatch

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create database schema
        run: python db.py

      - name: Lint (ruff)
        run: ruff check driftwatch tests main.py db.py index_now.py conftest.py

      - name: Security self-scan (bandit)
        run: bandit -r driftwatch -ll -q

      - name: Security self-scan (semgrep, bundled ruleset)
        run: semgrep --config driftwatch/static_analysis/rules/security.yml --quiet driftwatch

      - name: Evaluation module smoke test
        # Not a real evaluation run: that needs live Gemini/Groq
        # credentials and makes real LLM calls on every push, which
        # Phase 3 already found to be flaky under Gemini's free-tier rate
        # limit. This just confirms the module and its dependency chain
        # import cleanly. Dummy env vars match tests/conftest.py's values.
        env:
          GITHUB_APP_ID: test-app-id
          GITHUB_WEBHOOK_SECRET: test-webhook-secret
          GITHUB_INSTALLATION_ID: test-installation-id
          GEMINI_API_KEY: test-gemini-key
          DATABASE_URL: postgresql://test:test@localhost:5432/test
        run: python -c "import driftwatch.cli.evaluate"

      - name: Test suite (pytest)
        env:
          RUN_DB_TESTS: "1"
        run: pytest tests/unit tests/integration tests/db -v

  dashboard:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Unit tests (vitest)
        run: npm test

      - name: Build
        run: npm run build
